name: Build new AX6000 firmware and SDK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and deploy the matching firmware and package repository to Pages
        required: false
        default: false
        type: boolean

concurrency:
  group: package-repository
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROFILE: profiles/redmi-ax6000-new.json

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.FIRMWARE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require a GitHub hosted runner
        if: runner.environment != 'github-hosted'
        run: |
          echo 'FIRMWARE_RUNNER must name a GitHub hosted runner; self-hosted runners are unsupported.' >&2
          exit 1
      - name: Reclaim disposable hosted runner toolchain storage
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          [[ "$RUNNER_KIND" == github-hosted ]] || exit 1
          # Fixed unused toolchains from the prior successful hosted workflow:
          # valujin/Redmi-ImmortalWrt-padavanonly@d64307364dc50f923f8344795cdeded86a58a4e6
          # .github/workflows/ax6000-stock-padavanonly.yml
          # Current runner-images install-haskell.sh uses /usr/local/.ghcup.
          df -h "$RUNNER_TEMP"
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null; then
            sudo docker image prune --all --force
          fi
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check hosted runner storage
        run: |
          python3 - <<'PY'
          import os
          import shutil

          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          required = 60 * 1024 ** 3
          if free < required:
              raise SystemExit(f'Full firmware, SDK and kernel modules require at least 60 GiB '
                               f'free; this hosted runner has {free / 1024 ** 3:.1f} GiB. '
                               'Use the documented local isolated build command instead.')
          PY
      - name: Check requested signing prerequisite
        if: inputs.publish
        env:
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
        run: |
          if [[ -z "$OPKG_SIGNING_KEY" ]]; then
            echo 'Set repository secret OPKG_SIGNING_KEY before requesting publication.' >&2
            exit 1
          fi
      - name: Run lightweight verification
        run: |
          python3 -m unittest discover -s tests -v
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Resolve Tailscale and keep reviewed firmware feed pins
        run: |
          python3 scripts/monitor.py --profile "$PROFILE" --output state/firmware-lock.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Full firmware uses reviewed source pins; daily SDK builds track feeds.
          profile = json.loads(Path(os.environ['PROFILE']).read_text())
          path = Path('state/firmware-lock.json')
          lock = json.loads(path.read_text())
          lock['feeds'] = {feed['name']: feed['commit'] for feed in profile['feeds']}
          path.write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n')
          PY
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl zstd xz-utils perl patch libelf-dev swig \
            subversion g++-multilib gcc-multilib
      - name: Build firmware, SDK and kernel modules
        run: |
          mkdir -p logs
          bash scripts/build-firmware.sh --profile "$PROFILE" --lock state/firmware-lock.json \
            --work-dir "$RUNNER_TEMP/firmware-build" --output-dir raw \
            2>&1 | tee logs/firmware-build.log
      - name: Independently verify images, stock factory UBI and matching SDK
        run: |
          python3 scripts/verify-firmware.py \
            --source "$RUNNER_TEMP/firmware-build/source" --raw raw \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/firmware-verification.json"
      - name: Upload complete firmware and SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-firmware-sdk-packages-${{ github.run_id }}
          path: raw
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-build-diagnostics-${{ github.run_id }}
          path: |
            logs
            state/firmware-lock.json
            ${{ runner.temp }}/firmware-verification.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate and sign the matching repository
        if: inputs.publish
        env:
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/opkg-signing.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$OPKG_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          unset OPKG_SIGNING_KEY
          python3 scripts/publish.py --profile raw/profile.json --input raw \
            --output public --key "$key" --public-key keys/repository.pub \
            --usign raw/usign --lock raw/lock.json
      - name: Check complete Pages artifact size
        if: inputs.publish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          size = sum(path.stat().st_size for path in Path('public').rglob('*') if path.is_file())
          if size > 1_000_000_000:
              raise SystemExit('Complete repository exceeds the GitHub Pages 1 GB site limit. '
                               'Firmware, SDK and package artifacts remain available in this run.')
          PY
      - name: Prepare Pages
        if: inputs.publish
        uses: actions/configure-pages@v5
      - name: Upload signed Pages artifact
        if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy matching firmware and package repository
        id: deployment
        uses: actions/deploy-pages@v4
