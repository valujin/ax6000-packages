name: Monitor and publish packages

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published source lock is unchanged
        required: false
        default: false
        type: boolean

# One full publication at a time, including the source comparison. Failed builds
# leave the last successful Pages deployment and its source lock in place.
concurrency:
  group: package-repository
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROFILE: profiles/redmi-ax6000.json

jobs:
  monitor:
    # Manual runs on feature branches cannot access the publication path.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.profile.outputs.enabled }}
      changed: ${{ steps.monitor.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check compatibility profile
        id: profile
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = json.loads(Path(os.environ['PROFILE']).read_text())
          enabled = profile.get('enabled') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'enabled={str(enabled).lower()}\n')
          if not enabled:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Package publication is disabled; source monitoring remains active. '
                                'Complete the exact firmware '
                                'commit, kernel ABI and matching SDK URL/checksum in '
                                '`profiles/redmi-ax6000.json`, then set `enabled` to `true`. '
                                'See `docs/CI.md` for Pages and signing setup.\n')
          PY
      - name: Read last successfully published source lock
        env:
          PACKAGE_REPOSITORY_URL: ${{ vars.PACKAGE_REPOSITORY_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/', 1)
          base = os.environ['PACKAGE_REPOSITORY_URL'].strip()
          if not base:
              base = f'https://{owner.lower()}.github.io/{repo}'
          parsed = urllib.parse.urlsplit(base)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.query or parsed.fragment:
              raise SystemExit('PACKAGE_REPOSITORY_URL must be an HTTPS site base URL')
          url = base.rstrip('/') + '/state/lock.json'
          Path('state').mkdir(exist_ok=True)
          request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read(8 * 1024 * 1024 + 1)
              if len(body) > 8 * 1024 * 1024:
                  raise SystemExit('Published source lock is unexpectedly large')
              json.loads(body)
              Path('state/previous.json').write_bytes(body)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print('No published source lock exists; this is the first publication.')
          PY
      - name: Resolve sources and detect changes
        id: monitor
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          args=(--profile "$PROFILE" --output state/lock.json)
          if [[ -f state/previous.json ]]; then
            args+=(--previous state/previous.json)
          fi
          python3 scripts/monitor.py "${args[@]}"
          if [[ "$FORCE" == true ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Store resolved source lock
        if: steps.monitor.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: source-lock
          path: state/lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize unchanged sources
        if: steps.monitor.outputs.changed != 'true'
        run: echo 'Published source lock is unchanged; no build is needed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize monitored sources
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path('state/lock.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\nLatest monitored inputs:\n\n')
              for name, revision in sorted(lock.get('feeds', {}).items()):
                  summary.write(f'- Feed `{name}`: `{revision}`\n')
              version = lock.get('tailscale', {}).get('version', 'unavailable')
              summary.write(f'- Tailscale: `{version}`\n')
          PY

  build:
    needs: monitor
    if: needs.monitor.outputs.enabled == 'true' && needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: source-lock
          path: state
      - name: Run unit tests and shell checks
        run: |
          python3 -m unittest discover -s tests -v
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Check signing prerequisite
        env:
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
        run: |
          if [[ -z "$OPKG_SIGNING_KEY" ]]; then
            echo 'Set the repository secret OPKG_SIGNING_KEY before building.' >&2
            exit 1
          fi
      - name: Install SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl zstd xz-utils
      - name: Build packages on the GitHub hosted runner
        run: |
          bash scripts/build.sh --profile "$PROFILE" --lock state/lock.json \
            --work-dir "$RUNNER_TEMP/sdk-build" --output-dir raw
      - name: Validate and sign package repository
        env:
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
        run: |
          if [[ -z "$OPKG_SIGNING_KEY" ]]; then
            echo 'Set the repository secret OPKG_SIGNING_KEY to the private usign key.' >&2
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/opkg-signing.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$OPKG_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          unset OPKG_SIGNING_KEY
          python3 scripts/publish.py --profile "$PROFILE" --input raw \
            --output public --key "$key" --usign raw/usign --lock state/lock.json
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Upload complete repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated repository
        id: deployment
        uses: actions/deploy-pages@v4
